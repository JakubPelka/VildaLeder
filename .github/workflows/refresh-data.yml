name: Refresh observation data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: observation-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install geospatial dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh current-month partitions and aggregates
        env:
          SOS_SUBSCRIPTION_KEY: ${{ secrets.SOS_SUBSCRIPTION_KEY }}
        run: python scripts/refresh_data.py --incremental

      - name: Verify generated catalog
        run: python -m unittest discover -s tests -v

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/search-index.json data/observations
          git commit -m "data: refresh observation snapshot"
          git push origin HEAD:main

      - name: Deploy refreshed snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
